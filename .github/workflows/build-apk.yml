name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check index.html exists
        run: test -f www/index.html
      - run: npm install
      - name: Bundle PDF.js locally (offline)
        run: |
          npm install pdfjs-dist@3.11.174 --no-save
          cp node_modules/pdfjs-dist/build/pdf.min.js www/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdf.worker.min.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: velonet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
